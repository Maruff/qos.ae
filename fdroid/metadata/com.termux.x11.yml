Name: qos Desktop
Summary: The X11 desktop display for qos
Description: |-
  qos Desktop shows a Linux desktop (XFCE) for qos, so graphical programs run on
  your phone or tablet: editors, Krita, Inkscape, GIMP, Kdenlive, Godot and more.

  Install qos first. qos Desktop is signed with the same key and runs as part of
  qos itself. Then tap Desktop in the qos side drawer: the first time, it sets up
  XFCE (about 100 MB to download) and opens the desktop.

  qos Desktop is built from Termux:X11. It replaces Termux:X11 and cannot be used
  with Termux.
