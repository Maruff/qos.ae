<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="t">
  <title id="t">Illustration: qos terminal on a phone, installing packages and starting a web server</title>
  <style>
    text { white-space: pre; }
    .m { font: 12.5px ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; fill: #d6e2df; }
    .p { fill: #10f3be; } .d { fill: #6f8a84; } .g { fill: #8be9a8; } .y { fill: #f5c451; } .b { fill: #8fb8ff; }
    .k { font: 11px ui-monospace, Menlo, Consolas, monospace; fill: #d6e2df; text-anchor: middle; }
  </style>
  <rect x="6" y="6" width="348" height="708" rx="46" fill="#16201d" stroke="#2a3a36" stroke-width="2"/>
  <rect x="18" y="18" width="324" height="684" rx="36" fill="#000"/>
  <rect x="150" y="30" width="60" height="16" rx="8" fill="#16201d"/>
  <text x="34" y="44" class="m d" style="font-size:11px">9:41</text>
  <text x="326" y="44" class="m d" style="font-size:11px;text-anchor:end">5G ▮▮▮ 82%</text>

  <g transform="translate(30 86)">
    <text class="m" y="0"><tspan class="p">~ $</tspan> pkg install git python</text>
    <text class="m d" y="20">Reading package lists... Done</text>
    <text class="m d" y="38">Setting up python (3.14.6) ...</text>
    <text class="m d" y="56">Setting up git (2.52.0) ...</text>
    <text class="m" y="84"><tspan class="p">~ $</tspan> git clone github.com/you/site</text>
    <text class="m d" y="104">Cloning into 'site'... done.</text>
    <text class="m" y="132"><tspan class="p">~ $</tspan> cd site &amp;&amp; git log --oneline</text>
    <text class="m" y="152"><tspan class="y">3f9c2e1</tspan> Add contact page</text>
    <text class="m" y="170"><tspan class="y">a17b04d</tspan> Tamil translation</text>
    <text class="m" y="188"><tspan class="y">5be88c0</tspan> First version</text>
    <text class="m" y="216"><tspan class="p">~/site $</tspan> python -m http.server</text>
    <text class="m g" y="236">Serving HTTP on 0.0.0.0 port 8000</text>
    <text class="m b" y="254">127.0.0.1 - "GET / HTTP/1.1" 200</text>
    <text class="m" y="282"><tspan class="p">~/site $</tspan> <tspan fill="#10f3be">▌</tspan></text>
  </g>

  <g transform="translate(18 610)">
    <rect width="324" height="72" fill="#0b100f"/>
    <g class="k">
      <text x="27" y="28">ESC</text><text x="81" y="28">/</text><text x="135" y="28">-</text>
      <text x="189" y="28">HOME</text><text x="243" y="28">↑</text><text x="297" y="28">END</text>
      <text x="27" y="58">TAB</text><text x="81" y="58">CTRL</text><text x="135" y="58">ALT</text>
      <text x="189" y="58">←</text><text x="243" y="58">↓</text><text x="297" y="58">→</text>
    </g>
  </g>
  <rect x="130" y="690" width="100" height="5" rx="2.5" fill="#2a3a36"/>
</svg>
